<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instrument Table · Music Beacon XR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="description" content="3D instruments you play with your hands: strike bars, pluck strings, play the orb in the air, twist dials and spin wheels. Mouse, touch, VR and AR.">
<style>
:root {
  --bg: #0b1016;
  --panel: rgba(21, 28, 37, 0.9);
  --line: #2a3644;
  --fg: #e6ebf1;
  --muted: #8d9aab;
  --accent: #ffb547;
  --err: #ff7a7a;
  color-scheme: dark;
  font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --panel: rgba(255, 255, 255, 0.93); --line: #d5dce5; --fg: #17202b; --muted: #5b6878; --accent: #b86400; --err: #b42318; }
}
:root[data-theme="light"] { --panel: rgba(255, 255, 255, 0.93); --line: #d5dce5; --fg: #17202b; --muted: #5b6878; --accent: #b86400; --err: #b42318; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
body.in-ar { background: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#tags span { position: absolute; transform: translate(-50%, -50%); white-space: pre; text-align: center; line-height: 1.2; color: #e6ebf1; text-shadow: 0 0 3px #0b1016, 0 0 3px #0b1016; font-size: 11px; }
#tags span.title { font-weight: 600; font-size: 13px; }
body.in-xr #tags { display: none; }
#overlay { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-width: min(460px, 100%); backdrop-filter: blur(6px); }
h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
h1 a { color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
button, select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
#msg { color: var(--muted); margin: 6px 0 0; font-size: 13px; }
#msg.err { color: var(--err); }
#patches { display: none; max-height: 46vh; overflow: auto; margin-top: 8px; }
#patches.open { display: block; }
#patches table { border-collapse: collapse; width: 100%; font-size: 13px; }
#patches td { padding: 3px 4px; }
#patches td:first-child { color: var(--muted); white-space: nowrap; }
#patches select { min-height: 30px; padding: 3px 6px; max-width: 150px; }
h1 { display: flex; align-items: baseline; gap: 0; }
.fold { margin-left: auto; min-height: 28px; padding: 0 10px; font-size: 13px; }
.panel.folded .row:not(:first-of-type), .panel.folded #patches, .panel.folded #msg { display: none; }
.xr-only { display: none; }
body.in-xr .xr-only { display: inline-flex; }
body.in-xr .screen-only { display: none; }
.hint { color: var(--muted); font-size: 12px; margin-top: auto; pointer-events: none; }
body.in-xr .hint { display: none; }
</style>
</head>
<body>
<canvas id="view" aria-label="3D table of playable instruments"></canvas>
<div id="tags" aria-hidden="true"></div>
<div id="overlay">
  <div class="panel">
    <h1>Instrument Table <a href="./" class="screen-only">Map ↗</a> <a href="synths.html" class="screen-only">Synths ↗</a> <button id="fold" class="fold" aria-expanded="true" aria-label="Show or hide the controls">▴</button></h1>
    <div class="row">
      <button class="primary screen-only" id="sound">Start sound</button>
      <button class="screen-only" id="startVR" disabled>Start VR</button>
      <button class="screen-only" id="startAR" disabled>Start AR</button>
      <button class="xr-only" id="recenter">Bring table here</button>
      <button class="xr-only" id="exit">Exit</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="lock" checked> Keep notes in key</label>
      <select id="key" aria-label="Key"></select>
      <select id="scale" aria-label="Scale"></select>
      <button id="patchBtn" aria-expanded="false" aria-controls="patches">Patches ▸</button>
    </div>
    <div class="row">
      <label for="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
    <div id="patches"></div>
    <p id="msg" role="status"></p>
  </div>
  <p class="hint">Click or tap to play · drag to slide, bend and strum · wheel turns dials · drag empty space to look around · L lock · P patches</p>
</div>
<script type="module" src="src/play.js"></script>
</body>
</html>

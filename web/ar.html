<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beacon Field XR</title>
<meta name="description" content="The beacon field in AR and VR: walk your room to move between beacons and hear their songs blend.">
<style>
:root {
  --bg: #0b1016;
  --panel: rgba(21, 28, 37, 0.88);
  --line: #2a3644;
  --fg: #e6ebf1;
  --muted: #8d9aab;
  --accent: #ffb547;
  --err: #ff7a7a;
  color-scheme: dark;
  font: 14px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --panel: rgba(255, 255, 255, 0.92); --line: #d5dce5; --fg: #17202b; --muted: #5b6878; --accent: #b86400; --err: #b42318; }
}
:root[data-theme="light"] { --panel: rgba(255, 255, 255, 0.92); --line: #d5dce5; --fg: #17202b; --muted: #5b6878; --accent: #b86400; --err: #b42318; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
body.in-ar { background: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 10px; }
.panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-width: 420px; backdrop-filter: blur(6px); }
h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
h1 a { color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { max-width: 100%; }
label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
#status .key { font-weight: 600; }
#status ul { list-style: none; margin: 4px 0 0; padding: 0; font-variant-numeric: tabular-nums; }
#status li span { color: var(--muted); float: right; }
#msg { color: var(--muted); margin: 6px 0 0; font-size: 13px; }
#msg.err { color: var(--err); }
.xr-only { display: none; }
body.in-xr .xr-only { display: inline-flex; }
body.in-xr .screen-only { display: none; }
.hint { color: var(--muted); font-size: 12px; margin-top: auto; }
body.in-xr .hint { display: none; }
</style>
</head>
<body>
<canvas id="view" aria-label="3D view of the beacon field"></canvas>
<div id="overlay">
  <div class="panel">
    <h1>Beacon Field XR <a href="./" class="screen-only">Map ↗</a></h1>
    <div class="row">
      <button class="primary screen-only" id="startAR" disabled>Start AR</button>
      <button class="screen-only" id="startVR" disabled>Start VR</button>
      <button id="play">▶ Play</button>
      <button id="recenter" title="Lay the field out again around where you stand">Re-center</button>
      <button class="xr-only" id="exit">Exit</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label for="scale">Scale</label>
      <select id="scale"></select>
      <label for="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
    <p id="msg" role="status"></p>
  </div>
  <div class="panel" id="status" aria-live="off"></div>
  <p class="hint">Preview: WASD / arrows to walk, drag to look, Space to play, T to auto-walk.</p>
</div>
<script type="module" src="src/ar.js"></script>
</body>
</html>

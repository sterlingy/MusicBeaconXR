# Publishes the browser version (web/) to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SynthKit (addons/synthkit) is a private repo: fetch it with a read-only
      # token that can see only SynthKit (secret SYNTHKIT_TOKEN, renew yearly).
      - name: Fetch SynthKit
        env:
          TOKEN: ${{ secrets.SYNTHKIT_TOKEN }}
        run: |
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/" submodule update --init --depth 1 addons/synthkit
          test -f addons/synthkit/web/synthkit.wasm
          echo "SynthKit $(git -C addons/synthkit rev-parse --short HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test web/tests
      - name: Build
        run: python3 web/tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
